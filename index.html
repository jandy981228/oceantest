<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大五人格专业测评 | Big Five Personality Assessment</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#f4f2ec;--bg2:#ebe8e0;--card:#fff;--dark:#141428;--dark2:#1e1e3a;--dark3:#282848;
  --txt:#1a1a2e;--txt2:#55556a;--muted:#9a9ab0;--light:#d0d0e0;
  --acc:#b8860b;--acc2:#d4a84b;--acc3:#8b6508;
  --bd:#e2dfd7;--bdl:#ecebe4;
  --sh1:0 2px 8px rgba(20,20,40,.05);--sh2:0 4px 24px rgba(20,20,40,.08);--sh3:0 12px 48px rgba(20,20,40,.12);
  --r1:8px;--r2:14px;--r3:20px;
  --O:#2e6b8a;--C:#4a7c59;--E:#c4922a;--A:#b05070;--N:#6a5a9a;
  --fs:'Noto Serif SC','Songti SC',serif;--fn:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:var(--fn);background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.view{display:none;min-height:100vh;animation:fadeIn .4s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

/* ===== Welcome ===== */
.wc{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 20px;position:relative;overflow:hidden}
.wc-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 5%,rgba(184,134,11,.07) 0%,transparent 45%),radial-gradient(ellipse at 85% 95%,rgba(46,107,138,.06) 0%,transparent 45%);pointer-events:none}
.wc-hero{text-align:center;max-width:560px;position:relative;z-index:1}
.wc-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 18px;background:rgba(184,134,11,.08);border:1px solid rgba(184,134,11,.22);border-radius:100px;font-size:12px;font-weight:600;color:var(--acc3);letter-spacing:.5px;margin-bottom:28px}
.wc-badge .dot{width:6px;height:6px;background:var(--acc);border-radius:50%;animation:pulse 2s infinite}
.wc-title{font-family:var(--fs);font-size:clamp(30px,8vw,48px);font-weight:900;line-height:1.2;margin-bottom:14px;letter-spacing:-.5px}
.wc-title .acc{color:var(--acc)}
.wc-sub{font-size:14.5px;color:var(--txt2);line-height:1.85;margin-bottom:28px}
.ocean-row{display:flex;justify-content:center;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.ob{width:52px;text-align:center}
.ol{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-family:var(--fs);font-size:22px;font-weight:700;color:#fff;box-shadow:var(--sh1);margin-bottom:6px;transition:transform .3s}
.ob:hover .ol{transform:translateY(-4px) scale(1.05)}
.ol.o{background:var(--O)}.ol.c{background:var(--C)}.ol.e{background:var(--E)}.ol.a{background:var(--A)}.ol.n{background:var(--N)}
.on{font-size:10px;color:var(--muted);line-height:1.3}
.wc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.sc{background:var(--card);border:1px solid var(--bdl);border-radius:var(--r2);padding:14px 8px;text-align:center}
.sc .num{font-family:var(--fs);font-size:22px;font-weight:700;color:var(--acc);display:block;margin-bottom:2px}
.sc .label{font-size:10.5px;color:var(--muted);line-height:1.35}
.wc-btns{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 28px;border-radius:var(--r2);font-size:15.5px;font-weight:600;font-family:var(--fn);cursor:pointer;transition:all .25s ease;border:1.5px solid transparent}
.btn-dark{background:var(--dark);color:#fff;box-shadow:var(--sh2)}
.btn-dark:hover{background:var(--dark2);transform:translateY(-1px);box-shadow:var(--sh3)}
.btn-outline{background:transparent;color:var(--txt);border-color:var(--bd)}
.btn-outline:hover{border-color:var(--acc);color:var(--acc3);background:rgba(184,134,11,.04)}
.btn .arrow{transition:transform .25s}
.btn:hover .arrow{transform:translateX(4px)}
.wc-note{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7}

/* ===== About Page ===== */
.ab-wrap{max-width:760px;margin:0 auto;padding:32px 20px 60px}
.ab-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--txt2);cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .2s;margin-bot
